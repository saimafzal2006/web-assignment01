<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="login-page">
      <section class="login-card" aria-label="Login form">
        <div class="login-panel">
          <div class="brand-row">
            <div class="brand-icon" aria-hidden="true">
              <span class="brand-icon__shape"></span>
            </div>
            <span class="brand-name">Stripe</span>
          </div>

          <div class="form-wrap">
            <h1>Log in to your account</h1>
            <p>Please enter your details</p>
            <form class="login-form">
              <div class="field-group">
                <label for="email">Email</label>
                <div class="input-shell">
                  <img src="email-icon.svg" alt="Email" class="input-icon" />
                  <input id="email" type="email" placeholder="Enter your email" />
                </div>
              </div>

              <div class="field-group">
                <label for="password">Password</label>
                <div class="input-shell">
                  <span class="input-icon" aria-hidden="true">◌</span>
                  <input id="password" type="password" placeholder="••••••••" />
                </div>
              </div>

              <div class="meta-row">
                <label class="remember-me">
                  <input type="checkbox" checked />
                  <span>Remember for 30 days</span>
                </label>
                <a href="#">Forgot password</a>
              </div>

              <button type="submit" class="login-btn">Log in</button>

              <div class="separator"><span>Or</span></div>

             <a href="signup.html" class="social-btn"> <button type="button"  class="signupButton">
                signup
              </button>
             </a>
            </form>

            <p class="terms">By creating an account, you agree to our <a href="#">Terms of Use</a></p>
          </div>
        </div>

        <aside class="visual-panel" aria-label="Health community dashboard illustration">
          <div class="visual-panel__inner">
            <div class="visual-header">
              <div class="mini-brand">
                <span class="mini-brand__logo"></span>
                <span>Stripe</span>
              </div>
              <span class="mini-brand__tag">Availibilty</span>
            </div>

            <h2>Empowering facilities</h2>
            <img src="loginPageImage.png" alt="">
          </div>
        </aside>
      </section>
    </div>
  </body>
</html>
