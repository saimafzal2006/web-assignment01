<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create an account</title>
    <link rel="stylesheet" href="signup.css" />
  </head>
  <body>
    <div class="auth-shell">
      <aside class="visual-panel" aria-label="Brand illustration">
        <div class="visual-topbar">
          <div class="brand-mark">AMU</div>
          <a href="index.html"><button type="button" class="website-link">Back to website <span aria-hidden="true">→</span></button></a>
        </div>
        <div class="scene" aria-hidden="true">
          <img src="signupImage.png" alt="Scenic landscape" class="signin-image" />
        </div>
        <div class="visual-copy">
          <h1>Capturing Moments,<br />Creating Memories</h1>
          <div class="title-line" aria-hidden="true"></div>
        </div>
      </aside>

      <main class="form-panel">
        <h2>Create an account</h2>
        <p class="login-link">Already have an account? <a href="login.html">Log in</a></p>

        <form class="auth-form">
          <div class="name-row">
            <label class="input-wrapper">
              <input type="text" placeholder="Fletcher" aria-label="First name" />
            </label>
            <label class="input-wrapper">
              <input type="text" placeholder="Last name" aria-label="Last name" />
            </label>
          </div>

          <label class="input-wrapper full-width">
            <input type="email" placeholder="Email" aria-label="Email" />
          </label>

          <label class="input-wrapper password-field full-width">
            <input type="password" placeholder="Enter your password" aria-label="Password" />
            <button type="button" class="toggle-password" aria-label="Show password">◌</button>
          </label>

          <label class="checkbox-row">
            <input type="checkbox" checked />
            <span>I agree to the <a href="#">Terms &amp; Conditions</a></span>
          </label>

          <button type="submit" class="primary-btn">Create account</button>

          <div class="divider"><span>Or register with</span></div>

          <div class="social-row">
            <button type="button" class="social-btn">
              <span class="social-icon google-icon">G</span>
              <span>Google</span>
            </button>
            <button type="button" class="social-btn">
              <img src="apple-svgrepo-com.svg" alt="Apple" class="social-icon apple-icon" />
              <span>Apple</span>
            </button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
